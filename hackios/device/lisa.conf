# Xiaomi 11 Lite 5G NE (lisa) -- SM7325, the same SoC as redwood (POCO X5 Pro).
#
# Every address below is the same as redwood's: the UFS controller
# (0x1d84000), the GIC (0x17a00000 / 0x17a60000), the peripheral window, the
# display reservation (0xE1000000, "Display Reserved" in Mu-Silicium's
# lisaPkg MemoryMapLib) and the UEFI FD (0x9FD00000 + 0x200000, lisa.toml).
# lisa's own device tree has 8 cores numbered 0x0/0x100..0x700 with 0-3 the
# little ones -- redwood's platform description, so the loader needs no
# platform_lisa until the touch panel is ported.
NAME="Xiaomi 11 Lite 5G NE (lisa)"
KIND=phone
SOC="Qualcomm Snapdragon 778G (SM7325)"

UEFI_TARGET=lisa
UEFI_FD=                        # a built lisa SILICIUM_UEFI.fd; empty: Mu-Silicium/Build/lisaPkg/... or prebuilt/uefi
DTB=                            # empty: Mu-Silicium/Resources/DTBs/lisa.dtb (or prebuilt/uefi/redwood.dtb)
FD_BASE=0x9FD00000              # Mu-Silicium Resources/Configs/lisa.toml
FD_SIZE=0x200000
PAYLOAD_BASE=0xF0000000         # free SYS_MEM in lisaPkg's memory map

FB_BASE=0xE1000000              # GOP framebuffer == the reserved display region, 1080 x 2400
WIFI_ATH11K=1                   # WCN6750, the same radio as redwood

# touchscreen=0: lisa's panel is a Goodix GT9897T (k9d), not redwood's GT9916.
# Enable it only after that driver is ported.
BOOTARGS="touchscreen=0 cpufreq=1 bootcpu=7 cpus=8"
DEFAULT_SECS=900
USERLAND_VARS=""
# From a stock lisa ROM (the phone's own Android is gone): a660_*, wpss.*, adsp.*
FIRMWARE="fw-gpu fw-wifi fw-audio fw-haptic"
